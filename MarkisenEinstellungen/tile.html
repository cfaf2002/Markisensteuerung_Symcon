    Sicherheit: Alle Werte werden per textContent bzw. value gesetzt, nie als HTML.
                Geprüft und begrenzt wird jeder Wert im Modul, nicht nur hier.
    Leistung:   Keine externen Dateien, keine Dauer-Animationen. Plus/Minus wird gesammelt
                und erst nach einer kurzen Pause gesendet.
-->
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }

    #tile {
        /* Symcon-Design (Standard): Schrift- und Akzentfarbe der gewählten Visualisierung */
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, #e2a63b);
        --muted: color-mix(in srgb, var(--fg) 58%, transparent);
        --line: color-mix(in srgb, var(--fg) 10%, transparent);
        --card: color-mix(in srgb, var(--fg) 5%, transparent);
        --card-hi: color-mix(in srgb, var(--fg) 9%, transparent);
        --well: color-mix(in srgb, var(--fg) 8%, transparent);
        --glow: color-mix(in srgb, var(--accent) 30%, transparent);
        --ok: #34b36b;
        --bad: #e5484d;
        --r: 16px;

        box-sizing: border-box;
        width: 100%;
        height: 100%;
        /* Oben bleibt Platz für Titel und Symbole, die die Kachel-Visualisierung selbst zeichnet */
        --hdr: clamp(40px, 11cqmin, 54px);
        padding: var(--hdr) 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        container-type: size;
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }
    #tile.theme-dark  { --fg: #eef3f7; --accent: #e2a63b; background: radial-gradient(120% 80% at 0% 0%, #22374a, #142029 60%); border-radius: inherit; }
    #tile.theme-light { --fg: #1d2b36; --accent: #c98a1c; background: radial-gradient(120% 80% at 0% 0%, #ffffff, #e6eef4 60%); border-radius: inherit; }

    #scroll {
        flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
        padding: 2px clamp(8px, 3.5cqmin, 16px) clamp(8px, 3.5cqmin, 16px);
        scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }

    /* ---------- Raster: links Sonnenautomatik + Zeiten, rechts Sicherheit + Anwesenheit ---------- */
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    @container (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } }

    /* ---------- Karten ---------- */
    .card {
        position: relative;
        border-radius: var(--r);
        background: linear-gradient(180deg, var(--card-hi), var(--card));
        border: 1px solid var(--line);
        box-shadow: 0 1px 0 color-mix(in srgb, #fff 6%, transparent) inset, 0 8px 24px -16px rgba(0, 0, 0, .55);
        padding: 12px 14px 6px;
        transition: border-color .25s, box-shadow .25s;
    }
    .card.saving { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 0 3px var(--glow); }
    .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .icon {
        width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center;
        color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .card-h h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .01em; }

    .row { display: flex; align-items: center; gap: 10px; min-height: 46px; border-top: 1px solid var(--line); }
    .card-h + .row { border-top: 0; }
    .row .lbl { flex: 1; min-width: 0; color: color-mix(in srgb, var(--fg) 88%, transparent); overflow-wrap: anywhere; padding: 6px 0; }
    /* Handy: kompaktere Pillen, damit die Beschriftung Platz hat */
    @container (max-width: 420px) {
        .card { padding: 10px 10px 4px; }
        .pill button { width: 30px; }
        .pill .val { min-width: 58px; font-size: 14px; }
        .row { gap: 8px; }
    }
    .row.dim .lbl, .row.dim .pill, .row.dim input { opacity: .45; }

    /* ---------- Stepper als Pille ---------- */
    .pill {
        flex: none; display: flex; align-items: center; height: 36px; border-radius: 999px;
        background: var(--well); border: 1px solid var(--line); overflow: hidden;
    }
    .pill button {
        width: 38px; height: 100%; border: 0; background: none; color: inherit; cursor: pointer; padding: 0;
        display: grid; place-items: center; touch-action: manipulation;
    }
    .pill button svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
    .pill button:hover:not(:disabled) { background: var(--card-hi); }
    .pill button:active:not(:disabled) { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    .pill .val {
        min-width: 76px; padding: 0 4px; text-align: center; white-space: nowrap;
        font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .pill .val small { margin-left: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }

    /* ---------- Schalter ---------- */
    .switch {
        flex: none; width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; position: relative;
        background: var(--well); box-shadow: inset 0 0 0 1px var(--line); transition: background .2s, box-shadow .2s;
    }
    .switch::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
        background: color-mix(in srgb, var(--fg) 85%, transparent); box-shadow: 0 2px 6px rgba(0, 0, 0, .35); transition: transform .22s cubic-bezier(.3, .7, .4, 1.3), background .2s;
    }
    .switch[aria-checked="true"] { background: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); background: #fff; }

    /* ---------- Anwesenheit: großer Status ---------- */
    .presence { min-height: 58px; }
    .presence .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .presence .who b { font-size: 15px; }
    .presence .who span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .presence .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
    .presence.on .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }

    /* ---------- Uhrzeit ---------- */
    input[type="time"] {
        flex: none; height: 36px; box-sizing: border-box; font: inherit; font-size: 15px; font-weight: 700; color: inherit;
        background: var(--well); border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; color-scheme: dark light;
    }

    /* ---------- Wochentage als runde Chips ---------- */
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 6px 0 10px; }
    .day {
        aspect-ratio: 1; max-height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--well);
        color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 0;
        transition: background .2s, color .2s, box-shadow .2s;
    }
    .day[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: transparent; box-shadow: 0 4px 12px -4px var(--glow); }
    .days-lbl { padding-top: 10px; font-size: 12px; color: var(--muted); }

    button:disabled, input:disabled { opacity: .4; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .error { display: none; color: var(--bad); padding: 8px 0; }
    #tile.has-error .error { display: block; }
    #tile.has-error .grid { display: none; }
    .ro {
        display: none; margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; font-size: 12px;
        color: var(--muted); background: var(--card); border: 1px dashed var(--line);
    }
    #tile.read-only .ro { display: block; }

    @media (prefers-reduced-motion: reduce) {
        .switch, .switch::after, .day, .card { transition: none; }
    }
</style>

<div id="tile">
    <div id="scroll">
        <div class="error" id="error"></div>
        <div class="ro" data-t="Display only – changes are switched off in the instance">Display only – changes are switched off in the instance</div>
        <div class="grid" id="grid"></div>
    </div>
</div>

<script>
    (function () {
        'use strict';

        var tile = document.getElementById('tile');
        var grid = document.getElementById('grid');
        var pending = {};      // Name → Timer: gesammelte Plus/Minus-Klicks
        var DEBOUNCE = 700;
        var SVG = 'http://www.w3.org/2000/svg';

        // Symbole je Gruppe (eigene Pfade, keine externen Dateien)
        var ICONS = {
            'Sun protection': ['M12 4V2', 'M12 22v-2', 'M4 12H2', 'M22 12h-2', 'M5.6 5.6 4.2 4.2', 'M19.8 19.8l-1.4-1.4', 'M5.6 18.4l-1.4 1.4', 'M19.8 4.2l-1.4 1.4', 'M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z'],
            'Safety': ['M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z', 'M9 12l2 2 4-4'],
            'Times': ['M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', 'M12 7v5l3 2'],
            'Presence': ['M3 11 12 4l9 7', 'M5 10v10h14V10', 'M10 20v-5h4v5']
        };

        function t(s) {
            return typeof window.translate === 'function' ? window.translate(s) : s;
        }

        function send(name, value) {
            if (typeof window.requestAction === 'function') {
                window.requestAction('Set', JSON.stringify({ name: name, value: value }));
            }
        }

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function icon(paths) {
            var s = document.createElementNS(SVG, 'svg');
            s.setAttribute('viewBox', '0 0 24 24');
            s.setAttribute('aria-hidden', 'true');
            (paths || []).forEach(function (d) {
                var p = document.createElementNS(SVG, 'path');
                p.setAttribute('d', d);
                s.appendChild(p);
            });
            return s;
        }

        function decimals(step) {
            var s = String(step);
            return s.indexOf('.') < 0 ? 0 : s.length - s.indexOf('.') - 1;
        }

        function setValue(span, v, item) {
            var d = decimals(item.step);
            span.textContent = Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
            if (item.unit) span.appendChild(el('small', '', item.unit));
        }

        // Plus/Minus mit Wiederholung beim Gedrückthalten
        function repeatButton(btn, fn) {
            var timer = null;
            function stop() { clearTimeout(timer); timer = null; }
            btn.addEventListener('pointerdown', function (e) {
                if (btn.disabled) return;
                e.preventDefault();
                fn();
                var delay = 420;
                (function loop() {
                    timer = setTimeout(function () { fn(); delay = Math.max(70, delay * 0.8); loop(); }, delay);
                })();
            });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, stop); });
            btn.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
            });
        }

        function numberRow(item, ro, card) {
            var row = el('div', 'row');
            row.appendChild(el('span', 'lbl', item.label));
            var pill = el('span', 'pill');
            var minus = el('button');
            var plus = el('button');
            var val = el('span', 'val');
            minus.type = plus.type = 'button';
            minus.appendChild(icon(['M5 12h14']));
            plus.appendChild(icon(['M5 12h14', 'M12 5v14']));
            minus.setAttribute('aria-label', item.label + ' −');
            plus.setAttribute('aria-label', item.label + ' +');
            minus.disabled = plus.disabled = ro;
            setValue(val, item.value, item);

            function change(dir) {
                var d = decimals(item.step);
                var v = Math.round((Number(item.value) + dir * item.step) * Math.pow(10, d)) / Math.pow(10, d);
                v = Math.max(item.min, Math.min(item.max, v));
                if (v === item.value) return;
                item.value = v;
                setValue(val, v, item);
                card.classList.add('saving');
                clearTimeout(pending[item.name]);
                pending[item.name] = setTimeout(function () {
                    delete pending[item.name];
                    if (!Object.keys(pending).length) card.classList.remove('saving');
                    send(item.name, v);
                }, DEBOUNCE);
            }
            repeatButton(minus, function () { change(-1); });
            repeatButton(plus, function () { change(1); });

            pill.appendChild(minus);
            pill.appendChild(val);
            pill.appendChild(plus);
            row.appendChild(pill);
            return row;
        }

        function switchButton(item, ro, onChange) {
            var sw = el('button', 'switch');
            sw.type = 'button';
            sw.setAttribute('role', 'switch');
            sw.setAttribute('aria-checked', item.value ? 'true' : 'false');
            sw.setAttribute('aria-label', item.label);
            sw.disabled = ro || !!item.readOnly;
            sw.addEventListener('click', function () {
                item.value = !item.value;
                sw.setAttribute('aria-checked', item.value ? 'true' : 'false');
                if (onChange) onChange(item.value);
                send(item.name, item.value);
            });
            return sw;
        }

        function boolRow(item, ro, onChange) {
            var row = el('div', 'row');
            row.appendChild(el('span', 'lbl', item.label));
            row.appendChild(switchButton(item, ro, onChange));
            return row;
        }

        // Anwesenheit: großer Status mit Namen der Variable
        function presenceRow(item, ro) {
            var row = el('div', 'row presence' + (item.value ? ' on' : ''));
            row.appendChild(el('i', 'dot'));
            var who = el('span', 'who');
            var state = el('b', '', t(item.value ? 'Present' : 'Absent'));
            who.appendChild(state);
            who.appendChild(el('span', '', item.label));
            row.appendChild(who);
            row.appendChild(switchButton(item, ro, function (on) {
                row.classList.toggle('on', on);
                state.textContent = t(on ? 'Present' : 'Absent');
            }));
            return row;
        }

        function timeRow(item, ro) {
            var row = el('div', 'row');
            row.appendChild(el('span', 'lbl', item.label));
            var input = document.createElement('input');
            input.type = 'time';
            input.value = item.value;
            input.disabled = ro;
            input.setAttribute('aria-label', item.label);
            input.addEventListener('change', function () {
                if (/^\d{2}:\d{2}$/.test(input.value)) send(item.name, input.value);
            });
            row.appendChild(input);
            return row;
        }

        function weekdays(d, ro, card) {
            card.appendChild(el('div', 'days-lbl', d.weekdaysTitle || ''));
            var days = el('div', 'days');
            d.weekdays.forEach(function (w) {
                var b = el('button', 'day', w.label);
                b.type = 'button';
                b.setAttribute('aria-pressed', w.value ? 'true' : 'false');
                b.disabled = ro;
                b.addEventListener('click', function () {
                    w.value = !w.value;
                    b.setAttribute('aria-pressed', w.value ? 'true' : 'false');
                    send(w.name, w.value);
                });
                days.appendChild(b);
            });
            card.appendChild(days);
        }

        function render(d) {
            var cls = [];
            if (d.theme === 1) cls.push('theme-dark');
            if (d.theme === 2) cls.push('theme-light');
            if (d.error) cls.push('has-error');
            if (d.readOnly) cls.push('read-only');
            tile.className = cls.join(' ');
            document.getElementById('error').textContent = d.error || '';

            // Während Plus/Minus gesammelt wird, nicht neu zeichnen (sonst springt der Wert zurück)
            if (Object.keys(pending).length > 0) return;

            grid.textContent = '';
            if (d.error) return;
            var ro = !!d.readOnly;
            var groups = d.groups || [];
            // ältere Daten ohne Gruppenschlüssel: Wochentage zur letzten Gruppe
            var lastTitle = groups.length ? groups[groups.length - 1].title : '';
            var cols = [el('div', 'col'), el('div', 'col')];
            grid.appendChild(cols[0]);
            grid.appendChild(cols[1]);

            groups.forEach(function (g, i) {
                if (!g.items.length) return;
                var card = el('section', 'card');
                var head = el('div', 'card-h');
                var ic = el('span', 'icon');
                ic.appendChild(icon(ICONS[g.key] || ICONS.Times));
                head.appendChild(ic);
                head.appendChild(el('h3', '', g.title));
                card.appendChild(head);

                var isTimes = g.key ? g.key === 'Times' : g.title === lastTitle;
                if (isTimes && d.weekdays) weekdays(d, ro, card);

                // Uhrzeiten nur hervorheben, wenn das Zeitfenster eingeschaltet ist
                var timeRows = [];
                var windowOn = true;
                g.items.forEach(function (item) {
                    if (item.name === 'UseTimeWindow') windowOn = !!item.value;
                });
                g.items.forEach(function (item) {
                    var row;
                    if (item.name === 'Presence') {
                        row = presenceRow(item, ro);
                    } else if (item.type === 'bool') {
                        row = boolRow(item, ro, item.name === 'UseTimeWindow' ? function (on) {
                            timeRows.forEach(function (r) { r.classList.toggle('dim', !on); });
                        } : null);
                    } else if (item.type === 'time') {
                        row = timeRow(item, ro);
                        timeRows.push(row);
                        row.classList.toggle('dim', !windowOn);
                    } else {
                        row = numberRow(item, ro, card);
                    }
                    card.appendChild(row);
                });
                cols[i % 2].appendChild(card);
            });
        }

        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) {
            e.textContent = t(e.getAttribute('data-t'));
        });

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (msg) {
            try {
                render(typeof msg === 'string' ? JSON.parse(msg) : msg);
            } catch (e) {
                console.error('Markisen-Einstellungen:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
    })();
</script>
