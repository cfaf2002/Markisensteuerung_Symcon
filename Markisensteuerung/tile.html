<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }

    #tile {
        /* Symcon-Design (Standard): Schrift- und Akzentfarbe der gewählten Visualisierung */
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, #e2a63b);
        --canvas-a: var(--accent);
        --canvas-b: #fbf6ea;
        --muted: color-mix(in srgb, var(--fg) 62%, transparent);
        --line: color-mix(in srgb, var(--fg) 14%, transparent);
        --well: color-mix(in srgb, var(--fg) 7%, transparent);
        --ok: #34b36b;
        --bad: #e5484d;
        --info: #4b8ef0;
        --off: #8796a5;
        --tone: var(--info);
        --e: 0;                 /* Ausfahrgrad 0..1 */
        --travel: 2s;

        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        /* Oben bleibt Platz für Titel und Symbole, die die Kachel-Visualisierung selbst zeichnet */
        --hdr: clamp(40px, 11cqmin, 54px);
        padding: var(--hdr) clamp(8px, 4cqmin, 16px) clamp(8px, 4cqmin, 16px);
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 2.5cqmin, 10px);
        container-type: size;
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }
    #tile.theme-dark  { --fg: #eef3f7; --accent: #e2a63b; background: linear-gradient(180deg, #1b2a38, #142029); border-radius: inherit; }
    #tile.theme-light { --fg: #1d2b36; --accent: #c98a1c; background: linear-gradient(180deg, #f4f8fb, #e6eef4); border-radius: inherit; }

    #tile.tone-ok   { --tone: var(--ok); }
    #tile.tone-bad  { --tone: var(--bad); }
    #tile.tone-off  { --tone: var(--off); }

    /* ---------- Kopf ---------- */
    .head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
    .status {
        display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1;
        font-size: 15px; font-weight: 600;
    }
    .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 22%, transparent); }
    #tile.tone-bad .status .dot { animation: pulse 1.6s ease-in-out infinite; }
    .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .auto {
        flex: none; display: flex; align-items: center; gap: 6px;
        border: 0; background: none; color: inherit; font: inherit; font-size: 12px; cursor: pointer; padding: 4px 0;
    }
    .auto .track { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .2s; }
    .auto .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
    .auto[aria-checked="true"] .track { background: var(--accent); }
    .auto[aria-checked="true"] .track::after { transform: translateX(12px); background: #fff; }

    /* ---------- Bühne: Garten-Panorama mit Haus, Markise und Wetter ---------- */
    .stage {
        position: relative; flex: 1 1 auto; min-height: 70px;
        border-radius: 14px; overflow: hidden;
        box-shadow: inset 0 0 0 1px var(--line);
        /* Fläche über der Szene bei hohen, schmalen Kacheln: gleiche Farbe wie der obere Himmel */
        background: #3f8fe0; transition: background-color 1.2s ease;
    }
    #tile.wx-sun.eve .stage { background: #4a5fa8; }
    #tile.wx-cloud .stage { background: #7f97ae; }
    #tile.wx-night .stage { background: #07122a; }
    #tile.wx-rain .stage, #tile.wx-wind .stage, #tile.wx-storm .stage { background: #3d4a58; }
    #tile.wx-frost .stage { background: #9fb7cc; }
    .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* Himmel: weich überblendet je nach Wetter und Tageszeit */
    .sky { opacity: 0; transition: opacity 1.2s ease; }
    #tile.wx-sun .sky-day, #tile.wx-cloud .sky-grey, #tile.wx-night .sky-night,
    #tile.wx-rain .sky-storm, #tile.wx-wind .sky-storm, #tile.wx-storm .sky-storm, #tile.wx-frost .sky-cold { opacity: 1; }
    #tile.wx-sun.eve .sky-day { opacity: 0; }
    #tile.wx-sun.eve .sky-eve { opacity: 1; }

    .wx { opacity: 0; transition: opacity .9s ease; }
    #tile.wx-sun .sun, #tile.wx-sun .birds, #tile.wx-sun .fair, #tile.wx-cloud .fair, #tile.wx-cloud .sun.behind,
    #tile.wx-cloud .overcast, #tile.wx-night .moon, #tile.wx-night .stars,
    #tile.wx-rain .storm, #tile.wx-rain .rain, #tile.wx-storm .storm, #tile.wx-storm .rain, #tile.wx-storm .bolt,
    #tile.wx-wind .storm, #tile.wx-wind .wind, #tile.wx-frost .overcast, #tile.wx-frost .snow { opacity: 1; }
    #tile.wx-cloud .sun.behind { opacity: .55; }

    /* Sonne */
    .sun .glow { fill: url(#sunGlow); transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    .sun .core { fill: url(#sunCore); }
    .sun .rays { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
    .sun .rays path { stroke: #ffd36b; stroke-width: 2.4; stroke-linecap: round; opacity: .85; }

    /* Wolken ziehen langsam durch; jede Wolke mit eigener Geschwindigkeit */
    .cl { fill: url(#cloudWhite); }
    .cl.dark { fill: url(#cloudDark); }
    .drift { animation: drift linear infinite; }
    .d1 { animation-duration: 95s; animation-delay: -20s; }
    .d2 { animation-duration: 140s; animation-delay: -75s; }
    .d3 { animation-duration: 120s; animation-delay: -40s; }
    .d4 { animation-duration: 70s; animation-delay: -10s; }
    .d5 { animation-duration: 85s; animation-delay: -55s; }

    /* Vögel: fliegen quer über den Himmel und schlagen mit den Flügeln */
    .bird { animation: fly linear infinite; }
    .bird path { fill: none; stroke: #2d3a48; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; animation: flap .55s ease-in-out infinite alternate; }
    .b1 { animation-duration: 26s; }
    .b2 { animation-duration: 31s; animation-delay: -9s; }
    .b2 path { animation-delay: -.2s; }
    .b3 { animation-duration: 29s; animation-delay: -17s; }
    .b3 path { animation-delay: -.35s; }

    /* Nacht */
    .moon .disc { fill: #f3efe0; }
    .moon .halo { fill: url(#moonGlow); }
    .stars circle { fill: #fff; animation: twinkle 3s ease-in-out infinite alternate; }
    .stars circle:nth-child(2n) { animation-delay: -1.2s; }
    .stars circle:nth-child(3n) { animation-delay: -2.1s; }

    /* Regen, Wind, Schnee, Gewitter */
    .rain line { stroke: #9cc8f5; stroke-width: 1.3; stroke-linecap: round; animation: drop .8s linear infinite; }
    .rain line:nth-child(3n) { animation-delay: -.25s; }
    .rain line:nth-child(3n+1) { animation-delay: -.55s; }
    .wind path { fill: none; stroke: rgba(255, 255, 255, .75); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 40 80; animation: gust 2.2s linear infinite; }
    .wind path:nth-child(2) { animation-delay: -.7s; }
    .wind path:nth-child(3) { animation-delay: -1.4s; }
    .wind .leaf { fill: #7fb04a; stroke: none; animation: leaf 3.5s linear infinite; stroke-dasharray: none; }
    .wind .leaf:nth-of-type(2) { animation-delay: -1.7s; }
    .snow circle { fill: #fff; animation: snow 4s linear infinite; }
    .snow circle:nth-child(2n) { animation-duration: 5.5s; animation-delay: -2s; }
    .snow circle:nth-child(3n) { animation-delay: -3.1s; }
    .bolt path { fill: #ffe066; filter: drop-shadow(0 0 4px #fff3b0); animation: flash 4s steps(1) infinite; }

    /* Haus und Garten */
    .wall { fill: url(#wallGrad); }
    .siding { stroke: rgba(80, 60, 40, .12); stroke-width: 1; }
    .window-frame { fill: #f4f1ea; }
    .window-glass { fill: url(#glass); }
    .door-frame { fill: #3b2f26; }
    .door-leaf { fill: url(#doorGrad); transform-box: fill-box; transform-origin: left center; transition: transform 1s ease; }
    #tile.door-open .door-leaf { transform: scaleX(.28); }
    .door-inside { fill: #2a2119; }

    /* Nacht und Unwetter dunkeln die Szene ab, nachts leuchtet das Fenster */
    .dimmer { fill: #081226; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
    #tile.wx-night .dimmer { opacity: .5; }
    #tile.wx-rain .dimmer, #tile.wx-storm .dimmer, #tile.wx-wind .dimmer { opacity: .18; }
    .window-glow { fill: #ffcf73; opacity: 0; transition: opacity 1.2s ease; filter: drop-shadow(0 0 3px #ffb347); }
    #tile.wx-night .window-glow { opacity: .92; }
    .grass { fill: url(#grassGrad); }
    .terrace { fill: #b9a58d; }
    .terrace-line { stroke: rgba(70, 55, 40, .25); stroke-width: 1; }
    .furniture { fill: #5d4a3a; }
    .plant-pot { fill: #c46a3a; }
    .plant { fill: #4f9a45; }
    .flower { fill: #f28fb1; }

    /* Markise */
    .canvas-g {
        transform-box: view-box; transform-origin: 92px 44px;
        transform: scaleX(calc(.03 + var(--e) * .97));
        opacity: min(1, calc(var(--e) * 6));
        transition: transform var(--travel) linear, opacity var(--travel) linear;
    }
    .arm { fill: none; stroke: #5d6976; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .joint { fill: #5d6976; }
    .cloth { stroke: rgba(20, 30, 40, .55); stroke-width: .9; stroke-linejoin: round; }
    .cloth-under { fill: rgba(20, 30, 40, .35); }
    .cloth-shine { fill: rgba(255, 255, 255, .28); }
    .cassette { fill: #e8ecef; stroke: rgba(0, 0, 0, .15); stroke-width: .6; }
    .shade { fill: rgba(20, 30, 40, .28); transform-box: view-box; transform-origin: 92px 120px; transform: scaleX(calc(var(--e))); transition: transform var(--travel) linear; }
    #tile.wx-night .shade, #tile.wx-cloud .shade, #tile.wx-rain .shade, #tile.wx-storm .shade, #tile.wx-wind .shade, #tile.wx-frost .shade { opacity: .25; }

    /* ---------- Text und Fortschritt ---------- */
    .reason { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .timer { display: none; gap: 4px; flex-direction: column; }
    .timer.show { display: flex; }
    .timer .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; }
    .timer .row b { font-variant-numeric: tabular-nums; font-weight: 600; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--tone); transition: width 1s linear; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .link { border: 0; background: none; padding: 2px 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

    /* ---------- Sensoren (nur große Kacheln) ---------- */
    .sensors { display: none; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .sensors li { display: grid; grid-template-columns: 1fr auto 16px; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .sensors .lbl small { color: var(--muted); margin-left: 6px; }
    .sensors .val { font-variant-numeric: tabular-nums; font-weight: 600; }
    .sensors .mark { width: 8px; height: 8px; border-radius: 50%; justify-self: end; align-self: center; background: var(--ok); }
    .sensors .mark.no { background: var(--bad); }
    .sensors .mark.na { background: var(--off); }

    /* ---------- Bedienung ---------- */
    .ctrl { display: flex; gap: 6px; min-width: 0; }
    .ctrl button {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px;
        border: 1px solid var(--line); border-radius: 10px; background: var(--well); color: inherit;
        font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 6px;
    }
    .ctrl button svg { width: 14px; height: 14px; flex: none; }
    .ctrl button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .ctrl button:disabled { opacity: .4; cursor: not-allowed; }
    .ctrl button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #stop[hidden], #hold[hidden] { display: none; }
    #hold { flex: 0 0 auto; padding: 0 10px; }

    .sim {
        display: none; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        color: #7a4b00; background: repeating-linear-gradient(-45deg, #ffd166, #ffd166 8px, #ffc94a 8px, #ffc94a 16px);
    }
    #tile.simulation .sim { display: flex; }
    .sim span { overflow: hidden; text-overflow: ellipsis; }
    #tile.simulation .canvas-g { opacity: min(.75, calc(var(--e) * 6)); }

    .error { display: none; font-size: 13px; }
    #tile.has-error .error { display: block; }
    #tile.has-error .stage, #tile.has-error .ctrl, #tile.has-error .timer, #tile.has-error .reason,
    #tile.has-error .sensors, #tile.has-error .sim { display: none !important; }

    /* ---------- Größen ---------- */
    @container (min-height: 340px) and (min-width: 260px) {
        .sensors { display: block; }
    }
    @container (max-height: 210px) {
        .reason { -webkit-line-clamp: 1; }
        .links { display: none; }
    }
    /* Handy hochkant: Stopp und Halten nur als Symbol, damit alle vier Tasten passen */
    .ctrl button { min-width: 0; overflow: hidden; }
    .ctrl button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @container (max-width: 520px) {
        #stop, #hold { flex: 0 0 44px; }
        #stop span, #hold span { display: none; }
    }
    @container (max-width: 300px) {
        .ctrl button span { display: none; }
    }
    @container (max-height: 150px) or (max-width: 170px) {
        .stage, .reason, .timer { display: none; }
        .ctrl button span { display: none; }
        .auto .txt { display: none; }
        #tile.has-error .error { display: none; }
    }

    /* ---------- Ruhe ---------- */
    #tile.paused *, #tile.reduce * { animation-play-state: paused !important; }
    /* „Animationen reduzieren“ hält nur die Deko an (Wolken, Vögel, Regen …).
       Das Aus- und Einfahren ist eine Information und läuft immer in der Fahrzeit – Tuch und Schatten gemeinsam. */
    @media (prefers-reduced-motion: reduce) {
        #tile * { animation: none !important; }
        #tile .sky, #tile .wx, #tile .dimmer, #tile .window-glow { transition: none !important; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(var(--sw, 560px)); } }
    @keyframes fly { from { transform: translate(-40px, 0); } 50% { transform: translate(220px, -10px); } to { transform: translate(480px, 4px); } }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
    @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
    @keyframes snow { from { transform: translate(0, -20px); opacity: 0; } 15% { opacity: 1; } to { transform: translate(-12px, 120px); opacity: .2; } }
    @keyframes leaf { from { transform: translate(-60px, 0) rotate(0); opacity: 0; } 15% { opacity: 1; } to { transform: translate(440px, 30px) rotate(720deg); opacity: 0; } }
    @keyframes flash { 0%, 100% { opacity: 0; } 62% { opacity: 1; } 64% { opacity: 0; } 67% { opacity: 1; } 70% { opacity: 0; } }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--tone) 10%, transparent); } }
    @keyframes gust { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
    @keyframes drop { from { transform: translate(0, -10px); opacity: 0; } 20% { opacity: 1; } to { transform: translate(-6px, 70px); opacity: 0; } }
</style>

<div id="tile" class="tone-info">
    <div class="head">
        <div class="status" role="status" aria-live="polite"><i class="dot"></i><span id="statusText">…</span></div>
        <button class="auto" id="auto" role="switch" aria-checked="false"><span class="txt" data-t="Automatic">Automatic</span><i class="track"></i></button>
    </div>

    <div class="sim" id="sim"><span data-t="Simulation – the awning is not moved">Simulation – the awning is not moved</span></div>
    <div class="error" id="error"></div>

    <div class="stage" aria-hidden="true">
        <svg id="scene" viewBox="0 0 400 140" preserveAspectRatio="xMinYMax slice">
            <defs>
                <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fe0"></stop><stop offset=".75" stop-color="#9fd2fb"></stop><stop offset="1" stop-color="#d9efff"></stop></linearGradient>
                <linearGradient id="skyEve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5fa8"></stop><stop offset=".55" stop-color="#f08a5d"></stop><stop offset="1" stop-color="#ffd18a"></stop></linearGradient>
                <linearGradient id="skyGrey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f97ae"></stop><stop offset="1" stop-color="#cbd8e3"></stop></linearGradient>
                <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07122a"></stop><stop offset="1" stop-color="#22385e"></stop></linearGradient>
                <linearGradient id="skyStorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d4a58"></stop><stop offset="1" stop-color="#7d8b98"></stop></linearGradient>
                <linearGradient id="skyCold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb7cc"></stop><stop offset="1" stop-color="#eef4f8"></stop></linearGradient>
                <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"></stop><stop offset=".45" stop-color="#ffd166" stop-opacity=".45"></stop><stop offset="1" stop-color="#ffd166" stop-opacity="0"></stop></radialGradient>
                <radialGradient id="sunCore" cx=".4" cy=".35"><stop offset="0" stop-color="#fff8d6"></stop><stop offset=".6" stop-color="#ffd043"></stop><stop offset="1" stop-color="#f6a925"></stop></radialGradient>
                <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff" stop-opacity=".35"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
                <linearGradient id="cloudWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#dfe8f1"></stop></linearGradient>
                <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e9aa7"></stop><stop offset="1" stop-color="#5c6875"></stop></linearGradient>
                <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dcc8"></stop><stop offset="1" stop-color="#d8c7ae"></stop></linearGradient>
                <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe8ff"></stop><stop offset=".5" stop-color="#8fb9e0"></stop><stop offset="1" stop-color="#5f86ad"></stop></linearGradient>
                <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fb4d6"></stop><stop offset="1" stop-color="#6a8fb3"></stop></linearGradient>
                <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc25b"></stop><stop offset="1" stop-color="#4f9440"></stop></linearGradient>
                <pattern id="stripes" width="16" height="10" patternUnits="userSpaceOnUse">
                    <rect width="8" height="10" style="fill: var(--canvas-a)"></rect>
                    <rect x="8" width="8" height="10" style="fill: var(--canvas-b)"></rect>
                </pattern>
            </defs>

            <!-- Himmel -->
            <rect class="sky sky-day" width="1400" height="140" fill="url(#skyDay)"></rect>
            <rect class="sky sky-eve" width="1400" height="140" fill="url(#skyEve)"></rect>
            <rect class="sky sky-grey" width="1400" height="140" fill="url(#skyGrey)"></rect>
            <rect class="sky sky-night" width="1400" height="140" fill="url(#skyNight)"></rect>
            <rect class="sky sky-storm" width="1400" height="140" fill="url(#skyStorm)"></rect>
            <rect class="sky sky-cold" width="1400" height="140" fill="url(#skyCold)"></rect>

            <g class="wx stars">
                <circle cx="130" cy="14" r=".9"></circle><circle cx="170" cy="30" r=".7"></circle><circle cx="205" cy="10" r="1"></circle>
                <circle cx="300" cy="24" r=".8"></circle><circle cx="355" cy="12" r="1"></circle><circle cx="380" cy="40" r=".7"></circle>
                <circle cx="150" cy="48" r=".6"></circle><circle cx="240" cy="44" r=".7"></circle><circle cx="330" cy="58" r=".6"></circle>
            </g>
            <g class="wx moon"><circle class="halo" cx="270" cy="30" r="24"></circle><path class="disc" d="M276 18 a13 13 0 1 0 6 22 a10.5 10.5 0 1 1 -6 -22 z"></path></g>

            <g class="wx sun behind">
                <circle class="glow" cx="262" cy="32" r="34"></circle>
                <g class="rays">
                    <path d="M262 4 v6 M262 54 v6 M234 32 h6 M284 32 h6 M242.2 12.2 l4.2 4.2 M277.6 47.6 l4.2 4.2 M242.2 51.8 l4.2 -4.2 M277.6 16.4 l4.2 -4.2"></path>
                </g>
                <circle class="core" cx="262" cy="32" r="13"></circle>
            </g>

            <!-- Schönwetterwolken (bei Sonne wenige, bei Bewölkung mehr) -->
            <g class="wx fair" transform="translate(0 16)">

    <div class="ctrl">
        <button id="retract" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 L14 10 H2 Z" fill="currentColor"></path></svg><span data-t="Retract">Retract</span></button>
        <button id="stop" type="button" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"></rect></svg><span data-t="Stop">Stop</span></button>
        <button id="extend" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13 L14 6 H2 Z" fill="currentColor"></path></svg><span data-t="Extend">Extend</span></button>
        <button id="hold" type="button" role="switch" aria-checked="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.2 A6 6 0 1 0 13.8 10.5 A5 5 0 1 1 10.5 2.2 Z" fill="currentColor"></path></svg><span data-t="Hold">Hold</span></button>

<script>
    (function () {
        'use strict';

        var $ = function (id) { return document.getElementById(id); };
        var tile = $('tile');
        var last = null;
        var offset = 0;     // Serverzeit minus Tablet-Zeit (Sekunden)
        var tick = 0;

        function t(s) {
            return typeof window.translate === 'function' ? window.translate(s) : s;
        }

        function send(ident, value) {
            if (typeof window.requestAction === 'function') {
                window.requestAction(ident, value);
            }
        }

        function now() {
            return Math.floor(Date.now() / 1000) + offset;
        }

        function fmt(sec) {
            sec = Math.max(0, Math.round(sec));
            var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            var mm = (m < 10 && h ? '0' : '') + m, ss = (s < 10 ? '0' : '') + s;
            return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
        }

        function clockText(ts) {
            var d = new Date((ts - offset) * 1000);
            return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        }

        function link(text, ident) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'link';
            b.textContent = t(text);
            b.addEventListener('click', function () { send(ident, 0); });
            return b;
        }

        // Ausfahrgrad aus Zustand bzw. Position
        function extension(d) {
            if (d.hasPosition && typeof d.position === 'number') return d.position / 100;
            switch (d.state) {
                case 2: case 3: return 1;
                case 4: return 0.5;
                default: return 0;
            }
        }

        // Wetterbild: Sicherheit zuerst, dann Nacht, dann Sonne nach Helligkeit (nicht nur nach Status)
        function weather(d) {
            var s = d.status;
            if (s === 9) return 'wind';
            if (s === 10) return 'rain';
            if (s === 11) return 'frost';
            if (s === 14) return 'storm';
            if (d.sun && !d.sun.day) return 'night';
            if (s === 2 || d.sunny) return 'sun';
            return 'cloud';
        }

        // Markise genau in der eingestellten Fahrzeit bewegen. Wird die Kachel mitten in der Fahrt
        // geöffnet, geht es an der passenden Stelle weiter statt von vorn oder sprunghaft.
        var travelKey = '';
        function animateTravel(d) {
            var target = extension(d);
            var moving = (d.state === 1 || d.state === 2) && !d.hasPosition && d.travel > 0;
            var key = d.state + ':' + (d.travelStart || 0);
            if (!moving) {
                travelKey = key;
                tile.style.setProperty('--travel', '1.2s');
                tile.style.setProperty('--e', String(target));
                return;
            }
            if (key === travelKey) return; // dieselbe Fahrt läuft schon
            travelKey = key;
            var elapsed = Math.max(0, now() - (d.travelStart || now()));
            var done = Math.min(1, elapsed / d.travel);
            var start = d.state === 2 ? done : 1 - done;
            // ohne Übergang auf den aktuellen Stand setzen, dann den Rest der Fahrzeit animieren
            tile.style.setProperty('--travel', '0s');
            tile.style.setProperty('--e', String(start));
            void tile.offsetWidth;
            tile.style.setProperty('--travel', Math.max(0.3, d.travel - elapsed) + 's');
            tile.style.setProperty('--e', String(target));
        }

        function render(d) {
            last = d;
            if (typeof d.now === 'number') offset = d.now - Math.floor(Date.now() / 1000);

            var cls = ['tone-' + (d.tone || 'info'), 'wx-' + weather(d)];
            if (d.theme === 1) cls.push('theme-dark');
            if (d.theme === 2) cls.push('theme-light');
            if (d.reduce) cls.push('reduce');
            if (d.sun && d.sun.eve) cls.push('eve');
            if (d.door === false) cls.push('door-open');
            if (d.simulation) cls.push('simulation');
            if (d.error) cls.push('has-error', 'tone-off');
            if (tile.classList.contains('paused')) cls.push('paused');
            tile.className = cls.join(' ');

            $('error').textContent = d.error || '';
            $('statusText').textContent = d.error ? (d.errorTitle || '') : (d.statusText || '');
            $('reason').textContent = d.reason || '';

            var auto = $('auto');
            auto.setAttribute('aria-checked', d.automatic ? 'true' : 'false');
            auto.title = t(d.automatic ? 'Switch automatic off' : 'Switch automatic on');

            // Bewegung über die Fahrzeit der Markise darstellen
            animateTravel(d);

            $('stop').hidden = !d.canStop;
            var out = d.state === 2 || d.state === 3;
            var inn = d.state === 0 || d.state === 1;
            $('extend').classList.toggle('on', out);
            $('retract').classList.toggle('on', inn);
            $('extend').disabled = !!d.safety;
            $('extend').title = d.safety ? (d.reason || '') : '';

            var hold = $('hold');
            hold.hidden = !d.holdEnabled;
            hold.classList.toggle('on', !!d.hold);
            hold.setAttribute('aria-checked', d.hold ? 'true' : 'false');
            hold.title = t(d.hold ? 'End hold – the automatic decides again' : 'Hold – the awning stays as it is (evening mode)');

            renderSensors(d.sensors || []);
            renderTimer();
        }

        function renderSensors(list) {
            var ul = $('sensors');
            ul.textContent = '';
            list.forEach(function (s) {
                var li = document.createElement('li');
                var lbl = document.createElement('span');
                lbl.className = 'lbl';
                lbl.textContent = s.label;
                if (s.limit || s.note) {
                    var small = document.createElement('small');
                    small.textContent = s.note || s.limit;
                    lbl.appendChild(small);
                }
                var val = document.createElement('span');
                val.className = 'val';
                val.textContent = s.value;
                var mark = document.createElement('i');
                mark.className = 'mark' + (s.ok === false ? ' no' : (s.ok === null ? ' na' : ''));
                li.appendChild(lbl);
                li.appendChild(val);
                li.appendChild(mark);
                ul.appendChild(li);
            });
        }

        // Ein Countdown zur Zeit, wichtigster zuerst: Sperre → Handbetrieb → Karenz
        function renderTimer() {
            var d = last;
            var box = $('timer');
            var links = $('links');
            links.textContent = '';
            if (!d || d.error) { box.classList.remove('show'); return; }

            var n = now(), label = '', left = 0, total = 0;
            if (d.lockUntil > n) {
                label = t(d.status === 10 ? 'Rain lock' : 'Wind lock');
                left = d.lockUntil - n;
                total = Math.max(left, 60);
            } else if (d.manualUntil > n) {
                label = t('Automatic paused until') + ' ' + clockText(d.manualUntil);
                left = d.manualUntil - n;
                total = Math.max(left, 60);
                links.appendChild(link('Resume automatic', 'EndManual'));
            } else if (d.present === false && d.graceTotal > 0) {
                left = Math.max(0, (d.graceEnd || 0) - n);
                total = d.graceTotal;
                label = left > 0 ? t('Absent, grace period') : t('Absent, grace period expired');
                links.appendChild(link('Restart grace period', 'RestartGrace'));
                if (left > 0) links.appendChild(link('End grace period', 'EndGrace'));
            }

            if (!label) { box.classList.remove('show'); return; }
            box.classList.add('show');
            $('timerLabel').textContent = label;
            $('timerValue').textContent = fmt(left);
            $('timerBar').style.width = (total > 0 ? Math.min(100, left / total * 100) : 0).toFixed(1) + '%';
        }

        $('auto').addEventListener('click', function () {
            if (last) send('Automatic', !last.automatic);
        });
        $('retract').addEventListener('click', function () { send('Control', 0); });
        $('stop').addEventListener('click', function () { send('Control', 1); });
        $('extend').addEventListener('click', function () { send('Control', 2); });
        $('hold').addEventListener('click', function () {
            if (last) send('Hold', !last.hold);
        });

        // Szene passend zur Kachelgröße: breit = Panorama füllen, schmal/hoch = ganze Szene zeigen, Himmel darüber
        var scene = $('scene');
        function fitScene() {
            var r = scene.getBoundingClientRect();
            if (!r.width || !r.height) return;
            // Sichtbare Breite in Szenen-Einheiten: die volle Höhe bleibt immer sichtbar (Sonne wird nicht abgeschnitten).
            // Schmal: mindestens Haus bis Markisenende (295); breit/flach (z. B. Handy quer): Himmel und Wiese gehen bis 800 weiter.
            var w = Math.max(295, Math.min(1400, 140 * r.width / r.height));
            scene.setAttribute('viewBox', '0 0 ' + Math.round(w) + ' 140');
            scene.setAttribute('preserveAspectRatio', w >= 1400 ? 'xMinYMax slice' : 'xMinYMax meet');
            scene.style.setProperty('--sw', Math.round(w + 60) + 'px');
        }
        if (window.ResizeObserver) {
            new ResizeObserver(fitScene).observe(scene);
        }
        fitScene();

        // Statische Texte übersetzen
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
            el.textContent = t(el.getAttribute('data-t'));
        });

        // Countdown nur, solange die Kachel sichtbar ist
        var inView = true;
        function updatePause() {
            var p = document.hidden || !inView;
            tile.classList.toggle('paused', p);
            clearInterval(tick);
            if (!p) {
                renderTimer();
                tick = setInterval(renderTimer, 1000);
            }
        }
        document.addEventListener('visibilitychange', updatePause);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                inView = entries[0].isIntersecting;
                updatePause();
            }).observe(tile);
        }

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (data) {
            try {
                render(typeof data === 'string' ? JSON.parse(data) : data);
            } catch (e) {
                console.error('Markisen-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
        updatePause();
    })();
</script>
