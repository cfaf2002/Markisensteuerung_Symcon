    SPDX-License-Identifier: MIT

    Aufbau (von hinten nach vorn): Himmel über die ganze Kachel · Garten mit Haus und Markise ·
    Wetter davor (Regen, Schnee, Wind, Blitz) · Anzeige und Tasten.
    Sicherheit: Alle Werte werden per textContent gesetzt, nie als HTML.
    Leistung:   Keine externen Dateien, keine Filter auf bewegten Teilen (weiche Wolken über Verläufe),
                Animationen ruhen, solange die Kachel nicht sichtbar ist.
-->
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }

    #tile {
        /* Symcon-Design (Standard): Schrift- und Akzentfarbe der gewählten Visualisierung */
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, #e2a63b);
        --canvas-a: var(--accent);
        --canvas-b: #fbf6ea;
        --muted: color-mix(in srgb, var(--fg) 70%, transparent);
        --glass: rgba(18, 22, 28, .42);
        --glass-line: rgba(255, 255, 255, .12);
        --ok: #34b36b;
        --bad: #e5484d;
        --info: #4b8ef0;
        --off: #8796a5;
        --tone: var(--info);
        --e: 0;                 /* Ausfahrgrad 0..1 */
        --travel: 1.2s;

        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: size;
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }
    #tile.theme-dark  { --fg: #eef3f7; --accent: #e2a63b; background: #1b2530; border-radius: inherit; }
    #tile.theme-light { --fg: #1d2b36; --accent: #c98a1c; --glass: rgba(255, 255, 255, .55); --glass-line: rgba(0, 0, 0, .1); background: #e9eef3; border-radius: inherit; }

    #tile.tone-ok   { --tone: var(--ok); }
    #tile.tone-bad  { --tone: var(--bad); }
    #tile.tone-off  { --tone: var(--off); }

    /* ---------- Ebenen ---------- */
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .layer svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
    .ground { --below: 0px; }
    .sky { overflow: hidden; }
    .ground svg { top: 0; bottom: auto; height: calc(100% - var(--below)); }
    /* Unter dem Garten bleibt der graue Hintergrund der Kachel; dort liegen Werte und Tasten */
    .ground svg { border-bottom-left-radius: 0; }

    /* Himmel: zarte Tönung über dem Hintergrund der Visualisierung, je nach Wetter und Tageszeit */
    .tint { opacity: 0; transition: opacity 1.4s ease; }
    #tile.wx-sun .tint-day, #tile.wx-cloud .tint-grey, #tile.wx-night .tint-night,
    #tile.wx-rain .tint-storm, #tile.wx-wind .tint-storm, #tile.wx-storm .tint-storm, #tile.wx-frost .tint-cold { opacity: 1; }
    #tile.wx-sun.eve .tint-day { opacity: 0; }
    #tile.wx-sun.eve .tint-eve { opacity: 1; }

    .wx { opacity: 0; transition: opacity 1s ease; }
    #tile.wx-sun .sun, #tile.wx-sun .birds, #tile.wx-sun .fair, #tile.wx-cloud .fair, #tile.wx-cloud .sun,
    #tile.wx-cloud .overcast, #tile.wx-night .moon, #tile.wx-night .stars,
    #tile.wx-rain .storm, #tile.wx-rain .rain, #tile.wx-storm .storm, #tile.wx-storm .rain, #tile.wx-storm .bolt,
    #tile.wx-wind .storm, #tile.wx-wind .wind, #tile.wx-frost .overcast, #tile.wx-frost .snow { opacity: 1; }
    #tile.wx-cloud .sun { opacity: .45; }

    /* Sonne mit feinem Strahlenkranz und weichem Glühen */
    .sun .glow { fill: url(#sunGlow); transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
    .sun .rays { stroke: #ffe39a; stroke-width: 1.1; stroke-linecap: round; opacity: .75; transform-box: fill-box; transform-origin: center; animation: spin 90s linear infinite; }
    .sun .core { fill: url(#sunCore); }

    /* Weiche Wolken aus Verläufen (ohne teure Filter) */
    .drift { animation: drift linear infinite; }
    .d1 { animation-duration: 55s; animation-delay: -14s; }
    .d2 { animation-duration: 80s; animation-delay: -45s; }
    .d3 { animation-duration: 65s; animation-delay: -28s; }
    .d4 { animation-duration: 45s; animation-delay: -8s; }

    .bird { animation: fly linear infinite; }
    .bird path { fill: none; stroke: color-mix(in srgb, var(--fg) 70%, #000); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; animation: flap .55s ease-in-out infinite alternate; }
    .b1 { animation-duration: 18s; }
    .b2 { animation-duration: 23s; animation-delay: -8s; }
    .b2 path { animation-delay: -.2s; }
    .b3 { animation-duration: 21s; animation-delay: -13s; }
    .b3 path { animation-delay: -.35s; }

    .moon .disc { fill: #f3efe0; }
    .moon .halo { fill: url(#moonGlow); }
    .stars circle { fill: #fff; animation: twinkle 3s ease-in-out infinite alternate; }
    .stars circle:nth-child(2n) { animation-delay: -1.2s; }
    .stars circle:nth-child(3n) { animation-delay: -2.1s; }

    .rain line { stroke: #9cc8f5; stroke-width: 1.2; stroke-linecap: round; opacity: .8; animation: drop .8s linear infinite; }
    .rain line:nth-child(3n) { animation-delay: -.25s; }
    .rain line:nth-child(3n+1) { animation-delay: -.55s; }
    .wind path { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 40 80; animation: gust 2.2s linear infinite; }
    .wind path:nth-child(2) { animation-delay: -.7s; }
    .wind path:nth-child(3) { animation-delay: -1.4s; }
    .wind .leaf { fill: #7fb04a; stroke: none; stroke-dasharray: none; animation: leaf 3.5s linear infinite; }
    .wind .leaf:nth-of-type(2) { animation-delay: -1.7s; }
    .snow circle { fill: #fff; animation: snow 5s linear infinite; }
    .snow circle:nth-child(2n) { animation-duration: 6.5s; animation-delay: -2s; }
    .snow circle:nth-child(3n) { animation-delay: -3.1s; }
    .bolt path { fill: #ffe066; filter: drop-shadow(0 0 6px #fff3b0); animation: flash 4s steps(1) infinite; }

    /* Garten mit Haus und Markise */
    .wall { fill: url(#wallGrad); }
    .siding { stroke: rgba(80, 60, 40, .12); stroke-width: 1; }
    .window-frame { fill: #f4f1ea; }
    .window-glass { fill: url(#glass); }
    .door-frame { fill: #3b2f26; }
    .door-inside { fill: #2a2119; }
    .door-leaf { fill: url(#doorGrad); transform-box: fill-box; transform-origin: left center; transition: transform 1s ease; }
    #tile.door-open .door-leaf { transform: scaleX(.28); }
    .grass { fill: url(#grassGrad); }
    .terrace { fill: #b9a58d; }
    .terrace-line { stroke: rgba(70, 55, 40, .25); stroke-width: 1; }
    .furniture { fill: #5d4a3a; }
    .plant-pot { fill: #c46a3a; }
    .plant { fill: #4f9a45; }
    .flower { fill: #f28fb1; }
    .dimmer { opacity: 0; transition: opacity 1.2s ease; }
    #tile.wx-night .dimmer { opacity: .5; }
    #tile.wx-rain .dimmer, #tile.wx-storm .dimmer, #tile.wx-wind .dimmer { opacity: .2; }
    .window-glow { fill: #ffcf73; opacity: 0; transition: opacity 1.2s ease; filter: drop-shadow(0 0 3px #ffb347); }
    #tile.wx-night .window-glow { opacity: .92; }

    .canvas-g {
        transform-box: view-box; transform-origin: 92px 44px;
        transform: scaleX(calc(.03 + var(--e) * .97));
        opacity: min(1, calc(var(--e) * 6));
        transition: transform var(--travel) linear, opacity var(--travel) linear;
    }
    .arm { fill: none; stroke: #5d6976; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .joint { fill: #5d6976; }
    .cloth { stroke: rgba(20, 30, 40, .55); stroke-width: .9; stroke-linejoin: round; }
    .cloth-under { fill: rgba(20, 30, 40, .35); }
    .cloth-shine { fill: rgba(255, 255, 255, .28); }
    .cassette { fill: #e8ecef; stroke: rgba(0, 0, 0, .15); stroke-width: .6; }
    .shade { fill: rgba(20, 30, 40, .28); transform-box: view-box; transform-origin: 92px 120px; transform: scaleX(var(--e)); transition: transform var(--travel) linear; }
    #tile.wx-night .shade, #tile.wx-cloud .shade, #tile.wx-rain .shade, #tile.wx-storm .shade, #tile.wx-wind .shade, #tile.wx-frost .shade { opacity: .25; }
    #tile.simulation .canvas-g { opacity: min(.75, calc(var(--e) * 6)); }

    /* ---------- Anzeige ---------- */
    .ui {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        /* oben Platz für Titel und Symbole der Kachel-Visualisierung */
        padding: clamp(40px, 11cqmin, 54px) clamp(10px, 4cqmin, 20px) clamp(10px, 3.5cqmin, 16px);
        gap: clamp(4px, 1.6cqmin, 8px);
    }
    .ui > * { position: relative; }
    .shadow { text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 0 12px rgba(0, 0, 0, .35); }
    #tile.theme-light .shadow { text-shadow: 0 1px 2px rgba(255, 255, 255, .7); }

    .head { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 24px; }
    .auto {
        flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-radius: 999px;
        border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: inherit; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .auto .track { width: 32px; height: 18px; border-radius: 9px; background: rgba(255, 255, 255, .22); position: relative; transition: background .2s; }
    .auto .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .auto[aria-checked="true"] .track { background: var(--accent); }
    .auto[aria-checked="true"] .track::after { transform: translateX(14px); }

    .hero { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .big { font-size: clamp(30px, 11cqmin, 72px); font-weight: 800; line-height: 1.15; letter-spacing: -.02em; padding-bottom: .06em; }
    .big small { font-size: .38em; font-weight: 600; margin-left: .3em; letter-spacing: 0; color: var(--muted); }
    .pill {
        display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 14px 6px 10px; border-radius: 999px;
        background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        font-size: clamp(13px, 3.4cqmin, 17px); font-weight: 700;
    }
    .pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 28%, transparent); }
    #tile.tone-bad .pill .dot { animation: pulse 1.6s ease-in-out infinite; }
    .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reason { font-size: clamp(12px, 3cqmin, 15px); color: var(--fg); opacity: .9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .timer { display: none; flex-direction: column; gap: 4px; max-width: 520px; padding: 8px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .timer.show { display: flex; }
    .timer .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; }
    .timer .row b { font-variant-numeric: tabular-nums; }
    .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--tone); transition: width 1s linear; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; }
    .link { border: 0; background: none; padding: 2px 0; color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

    /* Platz für den Garten; die Szene selbst liegt als Ebene darunter */
    .spacer { flex: 1 1 auto; min-height: 0; }

    .chips { display: none; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .chips li {
        display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
        background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        font-size: 12px; white-space: nowrap;
    }
    .chips .lbl { color: var(--muted); }
    .chips .val { font-weight: 700; font-variant-numeric: tabular-nums; }
    .chips .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .chips .mark.no { background: var(--bad); }
    .chips .mark.na { background: var(--off); }

    .ctrl { display: flex; gap: 6px; min-width: 0; }
    .ctrl button {
        flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
        border: 1px solid var(--glass-line); border-radius: 12px; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: inherit; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 0 8px;
    }
    .ctrl button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ctrl button svg { width: 14px; height: 14px; flex: none; }
    .ctrl button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 38%, rgba(18, 22, 28, .45)); }
    .ctrl button:disabled { opacity: .45; cursor: not-allowed; }
    .ctrl button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #stop[hidden], #hold[hidden] { display: none; }
    #hold { flex: 0 0 auto; }

    .sim {
        display: none; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;
        color: #7a4b00; background: repeating-linear-gradient(-45deg, #ffd166, #ffd166 8px, #ffc94a 8px, #ffc94a 16px);
    }
    #tile.simulation .sim { display: inline-flex; }

    .error { display: none; font-size: 14px; max-width: 520px; padding: 10px 14px; border-radius: 12px; background: var(--glass); }
    #tile.has-error .error { display: block; }
    #tile.has-error .hero, #tile.has-error .ctrl, #tile.has-error .timer, #tile.has-error .chips, #tile.has-error .sim, #tile.has-error .ground { display: none !important; }

    /* ---------- Größen ---------- */
    @container (min-height: 380px) and (min-width: 300px) { .chips { display: flex; } }
    @container (max-width: 520px) {
        #stop, #hold { flex: 0 0 44px; }
        #stop span, #hold span { display: none; }
    }
    @container (max-width: 300px) { .ctrl button span { display: none; } }
    @container (max-height: 230px) { .reason, .links { display: none; } }
    @container (max-height: 160px) or (max-width: 170px) { .hero .big, .reason, .timer { display: none; } }

    /* ---------- Ruhe ---------- */
    #tile.paused *, #tile.reduce .layer * { animation-play-state: paused !important; }
    /* Ob sich Wolken, Vögel und Wetter bewegen, entscheidet die Option „Animationen reduzieren“ der Instanz
       (die Systemeinstellung „Animationseffekte“ von Windows/Android würde sonst alles anhalten) */

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(1.06); opacity: .85; } }
    @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(560px); } }
    @keyframes fly { from { transform: translate(-40px, 0); } 50% { transform: translate(220px, -10px); } to { transform: translate(480px, 4px); } }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
    @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--tone) 12%, transparent); } }
    @keyframes gust { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
    @keyframes drop { from { transform: translate(0, -20px); opacity: 0; } 20% { opacity: 1; } to { transform: translate(-8px, 160px); opacity: 0; } }
    @keyframes snow { from { transform: translate(0, -20px); opacity: 0; } 15% { opacity: 1; } to { transform: translate(-14px, 220px); opacity: .2; } }
    @keyframes leaf { from { transform: translate(-60px, 0) rotate(0); opacity: 0; } 15% { opacity: 1; } to { transform: translate(440px, 40px) rotate(720deg); opacity: 0; } }
    @keyframes flash { 0%, 100% { opacity: 0; } 62% { opacity: 1; } 64% { opacity: 0; } 67% { opacity: 1; } 70% { opacity: 0; } }
</style>

<div id="tile" class="tone-info">
    <!-- Himmel über die ganze Kachel -->
    <div class="layer sky" aria-hidden="true">
        <svg id="skysvg" viewBox="0 0 400 240" preserveAspectRatio="xMaxYMin slice">
            <defs>
                <linearGradient id="tDay" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="300"><stop offset="0" stop-color="#3a86d8" stop-opacity=".55"></stop><stop offset="1" stop-color="#3a86d8" stop-opacity="0"></stop></linearGradient>
                <linearGradient id="tEve" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="300"><stop offset="0" stop-color="#5a4fa0" stop-opacity=".5"></stop><stop offset=".6" stop-color="#f08a5d" stop-opacity=".35"></stop><stop offset="1" stop-color="#ffd18a" stop-opacity="0"></stop></linearGradient>
                <linearGradient id="tGrey" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="300"><stop offset="0" stop-color="#7f97ae" stop-opacity=".45"></stop><stop offset="1" stop-color="#7f97ae" stop-opacity="0"></stop></linearGradient>
                <linearGradient id="tNight" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="300"><stop offset="0" stop-color="#06102a" stop-opacity=".75"></stop><stop offset="1" stop-color="#1c3557" stop-opacity=".1"></stop></linearGradient>
                <linearGradient id="tStorm" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="300"><stop offset="0" stop-color="#2c3540" stop-opacity=".7"></stop><stop offset="1" stop-color="#5d6b78" stop-opacity=".1"></stop></linearGradient>
                <linearGradient id="tCold" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="300"><stop offset="0" stop-color="#a9c3da" stop-opacity=".45"></stop><stop offset="1" stop-color="#a9c3da" stop-opacity="0"></stop></linearGradient>
                <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff2c2" stop-opacity=".9"></stop><stop offset=".3" stop-color="#ffd166" stop-opacity=".35"></stop><stop offset="1" stop-color="#ffd166" stop-opacity="0"></stop></radialGradient>
                <radialGradient id="sunCore" cx=".42" cy=".38"><stop offset="0" stop-color="#fffbe6"></stop><stop offset=".55" stop-color="#ffe27a"></stop><stop offset="1" stop-color="#ffc83a"></stop></radialGradient>
                <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff" stop-opacity=".35"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
                <radialGradient id="puff"><stop offset="0" stop-color="#f4f7fa" stop-opacity=".55"></stop><stop offset=".55" stop-color="#dfe6ee" stop-opacity=".32"></stop><stop offset="1" stop-color="#dfe6ee" stop-opacity="0"></stop></radialGradient>
                <radialGradient id="puffDark"><stop offset="0" stop-color="#6d7885" stop-opacity=".8"></stop><stop offset=".55" stop-color="#55606c" stop-opacity=".5"></stop><stop offset="1" stop-color="#55606c" stop-opacity="0"></stop></radialGradient>
            </defs>
            <rect class="tint tint-day" x="-3000" y="-600" width="6000" height="1400" fill="url(#tDay)"></rect>
            <rect class="tint tint-eve" x="-3000" y="-600" width="6000" height="1400" fill="url(#tEve)"></rect>
            <rect class="tint tint-grey" x="-3000" y="-600" width="6000" height="1400" fill="url(#tGrey)"></rect>
            <rect class="tint tint-night" x="-3000" y="-600" width="6000" height="1400" fill="url(#tNight)"></rect>
            <rect class="tint tint-storm" x="-3000" y="-600" width="6000" height="1400" fill="url(#tStorm)"></rect>
            <rect class="tint tint-cold" x="-3000" y="-600" width="6000" height="1400" fill="url(#tCold)"></rect>

            <g class="wx stars">
                <circle cx="120" cy="30" r=".9"></circle><circle cx="170" cy="62" r=".7"></circle><circle cx="215" cy="22" r="1"></circle>
                <circle cx="260" cy="90" r=".8"></circle><circle cx="355" cy="22" r="1"></circle><circle cx="385" cy="80" r=".7"></circle>
                <circle cx="150" cy="96" r=".6"></circle><circle cx="240" cy="54" r=".7"></circle><circle cx="300" cy="112" r=".6"></circle>
                <circle cx="70" cy="70" r=".8"></circle><circle cx="30" cy="34" r=".7"></circle><circle cx="95" cy="118" r=".6"></circle>
            </g>
            <g class="wx moon"><circle class="halo" cx="320" cy="64" r="40"></circle><path class="disc" d="M327 48 a17 17 0 1 0 8 29 a13.5 13.5 0 1 1 -8 -29 z"></path></g>

<script>
    (function () {
        'use strict';

        var $ = function (id) { return document.getElementById(id); };
        var tile = $('tile');
        var last = null;
        var offset = 0;     // Serverzeit minus Tablet-Zeit (Sekunden)
        var tick = 0;

        function t(s) {
            return typeof window.translate === 'function' ? window.translate(s) : s;
        }

        function send(ident, value) {
            if (typeof window.requestAction === 'function') {
                window.requestAction(ident, value);
            }
        }

        function now() {
            return Math.floor(Date.now() / 1000) + offset;
        }

        function fmt(sec) {
            sec = Math.max(0, Math.round(sec));
            var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            var mm = (m < 10 && h ? '0' : '') + m, ss = (s < 10 ? '0' : '') + s;
            return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
        }

        function clockText(ts) {
            var d = new Date((ts - offset) * 1000);
            return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        }

        function link(text, ident) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'link';
            b.textContent = t(text);
            b.addEventListener('click', function () { send(ident, 0); });
            return b;
        }

        // Ausfahrgrad aus Zustand bzw. Position
        function extension(d) {
            if (d.hasPosition && typeof d.position === 'number') return d.position / 100;
            switch (d.state) {
                case 2: case 3: return 1;
                case 4: return 0.5;
                default: return 0;
            }
        }

        // Große Anzeige: Zustand der Markise (mit Positionsvariable in Prozent)
        var STATES = ['retracted', 'retracting', 'extending', 'extended', 'stopped'];
        function bigText(d) {
            var w = t(STATES[d.state] || 'retracted');
            w = w.charAt(0).toUpperCase() + w.slice(1);
            return d.hasPosition && typeof d.position === 'number' ? w + ' · ' + d.position + ' %' : w;
        }

        // Wetterbild: Sicherheit zuerst, dann Nacht, dann Sonne nach Helligkeit (nicht nur nach Status)
        function weather(d) {
            var s = d.status;
            if (s === 9) return 'wind';
            if (s === 10) return 'rain';
            if (s === 11) return 'frost';
            if (s === 14) return 'storm';
            if (d.sun && !d.sun.day) return 'night';
            if (s === 2 || d.sunny) return 'sun';
            return 'cloud';
        }

        // Markise genau in der eingestellten Fahrzeit bewegen. Wird die Kachel mitten in der Fahrt
        // geöffnet, geht es an der passenden Stelle weiter statt von vorn oder sprunghaft.
        var travelKey = '';
        function animateTravel(d) {
            var target = extension(d);
            var moving = (d.state === 1 || d.state === 2) && !d.hasPosition && d.travel > 0;
            var key = d.state + ':' + (d.travelStart || 0);
            if (!moving) {
                travelKey = key;
                tile.style.setProperty('--travel', '1.2s');
                tile.style.setProperty('--e', String(target));
                return;
            }
            if (key === travelKey) return; // dieselbe Fahrt läuft schon
            travelKey = key;
            var elapsed = Math.max(0, now() - (d.travelStart || now()));
            var done = Math.min(1, elapsed / d.travel);
            var start = d.state === 2 ? done : 1 - done;
            // ohne Übergang auf den aktuellen Stand setzen, dann den Rest der Fahrzeit animieren
            tile.style.setProperty('--travel', '0s');
            tile.style.setProperty('--e', String(start));
            void tile.offsetWidth;
            tile.style.setProperty('--travel', Math.max(0.3, d.travel - elapsed) + 's');
            tile.style.setProperty('--e', String(target));
        }

        function render(d) {
            last = d;
            if (typeof d.now === 'number') offset = d.now - Math.floor(Date.now() / 1000);

            var cls = ['tone-' + (d.tone || 'info'), 'wx-' + weather(d)];
            if (d.theme === 1) cls.push('theme-dark');
            if (d.theme === 2) cls.push('theme-light');
            if (d.reduce) cls.push('reduce');
            if (d.sun && d.sun.eve) cls.push('eve');
            if (d.door === false) cls.push('door-open');
            if (d.simulation) cls.push('simulation');
            if (d.error) cls.push('has-error', 'tone-off');
            if (tile.classList.contains('paused')) cls.push('paused');
            tile.className = cls.join(' ');

            $('error').textContent = d.error || '';
            $('big').textContent = bigText(d);
            $('statusText').textContent = d.error ? (d.errorTitle || '') : (d.statusText || '');
            $('reason').textContent = d.reason || '';

            var auto = $('auto');
            auto.setAttribute('aria-checked', d.automatic ? 'true' : 'false');
            auto.title = t(d.automatic ? 'Switch automatic off' : 'Switch automatic on');

            // Bewegung über die Fahrzeit der Markise darstellen
            animateTravel(d);

            $('stop').hidden = !d.canStop;
            var out = d.state === 2 || d.state === 3;
            var inn = d.state === 0 || d.state === 1;
            $('extend').classList.toggle('on', out);
            $('retract').classList.toggle('on', inn);
            $('extend').disabled = !!d.safety;
            $('extend').title = d.safety ? (d.reason || '') : '';

            var hold = $('hold');
            hold.hidden = !d.holdEnabled;
            hold.classList.toggle('on', !!d.hold);
            hold.setAttribute('aria-checked', d.hold ? 'true' : 'false');
            hold.title = t(d.hold ? 'End hold – the automatic decides again' : 'Hold – the awning stays as it is (evening mode)');

            renderSensors(d.sensors || []);
            renderTimer();
            layout();
        }

        function renderSensors(list) {
            var ul = $('sensors');
            ul.textContent = '';
            list.forEach(function (s) {
                var li = document.createElement('li');
                var lbl = document.createElement('span');
                lbl.className = 'lbl';
                lbl.textContent = s.label;
                li.title = s.note || s.limit || '';
                var val = document.createElement('span');
                val.className = 'val';
                val.textContent = s.value;
                var mark = document.createElement('i');
                mark.className = 'mark' + (s.ok === false ? ' no' : (s.ok === null ? ' na' : ''));
                li.appendChild(mark);
                li.appendChild(lbl);
                li.appendChild(val);
                ul.appendChild(li);
            });
        }

        // Ein Countdown zur Zeit, wichtigster zuerst: Sperre → Handbetrieb → Karenz
        function renderTimer() {
            var d = last;
            var box = $('timer');
            var links = $('links');
            links.textContent = '';
            if (!d || d.error) { box.classList.remove('show'); return; }

            var n = now(), label = '', left = 0, total = 0;
            if (d.lockUntil > n) {
                label = t(d.status === 10 ? 'Rain lock' : 'Wind lock');
                left = d.lockUntil - n;
                total = Math.max(left, 60);
            } else if (d.manualUntil > n) {
                label = t('Automatic paused until') + ' ' + clockText(d.manualUntil);
                left = d.manualUntil - n;
                total = Math.max(left, 60);
                links.appendChild(link('Resume automatic', 'EndManual'));
            } else if (d.present === false && d.graceTotal > 0) {
                left = Math.max(0, (d.graceEnd || 0) - n);
                total = d.graceTotal;
                label = left > 0 ? t('Absent, grace period') : t('Absent, grace period expired');
                links.appendChild(link('Restart grace period', 'RestartGrace'));
                if (left > 0) links.appendChild(link('End grace period', 'EndGrace'));
            }

            if (!label) { box.classList.remove('show'); return; }
            box.classList.add('show');
            $('timerLabel').textContent = label;
            $('timerValue').textContent = fmt(left);
            $('timerBar').style.width = (total > 0 ? Math.min(100, left / total * 100) : 0).toFixed(1) + '%';
        }

        $('auto').addEventListener('click', function () {
            if (last) send('Automatic', !last.automatic);
        });
        $('retract').addEventListener('click', function () { send('Control', 0); });
        $('stop').addEventListener('click', function () { send('Control', 1); });
        $('extend').addEventListener('click', function () { send('Control', 2); });
        $('hold').addEventListener('click', function () {
            if (last) send('Hold', !last.hold);
        });

        // Garten zwischen Anzeige und Tasten einpassen: oben bis unter die Anzeige, unten bis über Werte und Tasten.
        // Unter dem Garten geht die Wiese als Fläche weiter, darauf liegen Werte und Tasten.
        var scene = $('scene');
        var ground = document.querySelector('.ground');
        function layout() {
            var tr = tile.getBoundingClientRect();
            if (!tr.height) return;
            var hero = document.querySelector('.hero');
            var hr = hero.getBoundingClientRect();
            // Flache Kachel (z. B. Monitor-Leiste): Garten neben der Anzeige statt darunter
            var flat = tr.width / tr.height > 2.2;
            var top = flat ? (hr.top - tr.top) : ($('spacer').getBoundingClientRect().top - tr.top);
            var chips = $('sensors');
            var lowest = chips.offsetParent !== null && chips.childElementCount ? chips : document.querySelector('.ctrl');
            var below = Math.max(0, tr.bottom - lowest.getBoundingClientRect().top + 6);
            top = Math.max(0, Math.min(top, tr.height - below - 40));
            ground.style.top = top + 'px';
            ground.style.setProperty('--below', below + 'px');
            // Himmel und Wetter enden mit dem Garten; darunter grauer Hintergrund für Werte und Tasten
            document.querySelector('.sky').style.bottom = below + 'px';
            document.querySelector('.front').style.bottom = below + 'px';
            var h = tr.height - top - below;
            var w = Math.max(295, Math.min(1400, 140 * tr.width / Math.max(1, h)));
            var x = 0;
            if (flat) {
                // Text links frei lassen: Szene um die Breite der Anzeige nach rechts schieben
                var textRight = 0;
                Array.prototype.forEach.call(hero.children, function (c) {
                    var r = c.getBoundingClientRect();
                    if (r.width) textRight = Math.max(textRight, Math.min(r.right, r.left + c.scrollWidth) - tr.left);
                });
                x = -Math.round((textRight + 24) * 140 / Math.max(1, h));
            }
            scene.setAttribute('viewBox', x + ' 0 ' + Math.round(w) + ' 140');
            scene.setAttribute('preserveAspectRatio', w >= 1400 ? 'xMinYMax slice' : 'xMinYMax meet');
            // Hohe Kachel (Handy): Himmel nach Breite einpassen, damit die Sonne oben rechts bleibt und nicht hinter dem Text
            // Himmel genau passend zuschneiden (gleiches Seitenverhältnis wie die Fläche, keine Lücken).
            // Breit: rechter Rand fest, Sonne oben rechts. Schmal (Handy): Sonne rechts unterhalb der großen Anzeige.
            var skyH = Math.max(1, tr.height - below);
            var vw, vh, x0, y0, sc;
            if (tr.width >= 600) {
                vh = 240; sc = skyH / vh; vw = tr.width / sc; x0 = 400 - vw;
                // Sonne unter den Automatik-Schalter rücken, wenn die Kachel flach ist
                var headBottom = document.querySelector('.head').getBoundingClientRect().bottom - tr.top;
                y0 = Math.min(0, 64 - headBottom / sc - 34);
            } else {
                vw = 300; sc = tr.width / vw; vh = skyH / sc; x0 = 100;
                var heroBottom = hr.bottom - tr.top;
                y0 = Math.min(0, 64 - heroBottom / sc - 30);
            }
            $('skysvg').setAttribute('viewBox', x0.toFixed(1) + ' ' + y0.toFixed(1) + ' ' + vw.toFixed(1) + ' ' + vh.toFixed(1));
            $('skysvg').setAttribute('preserveAspectRatio', 'none');
        }
        if (window.ResizeObserver) {
            new ResizeObserver(layout).observe(tile);
        }

        // Statische Texte übersetzen
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
            el.textContent = t(el.getAttribute('data-t'));
        });

        // Countdown nur, solange die Kachel sichtbar ist
        var inView = true;
        function updatePause() {
            var p = document.hidden || !inView;
            tile.classList.toggle('paused', p);
            clearInterval(tick);
            if (!p) {
                renderTimer();
                tick = setInterval(renderTimer, 1000);
            }
        }
        document.addEventListener('visibilitychange', updatePause);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                inView = entries[0].isIntersecting;
                updatePause();
            }).observe(tile);
        }

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (data) {
            try {
                render(typeof data === 'string' ? JSON.parse(data) : data);
            } catch (e) {
                console.error('Markisen-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
        updatePause();
        layout();
    })();
</script>
